site_name: device-ingestion
repo_url: https://github.com/swordofzeus/device-ingestion
site_url: https://swordofzeus.github.io/device-ingestion
site_description: This service is responsible for ingesting device telemetry into the READY data lakehouse
site_author: Ashish Juneja
edit_uri: edit/main/docs/
repo_name: swordofzeus/device-ingestion
copyright: Maintained by <a href="https://swordofzeus.com">swordofzeus</a>.

nav:
  - Home: index.md
  - Modules: modules.md
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["src/device_ingestion"]
theme:
  name: material
  feature:
    tabs: true
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/swordofzeus/device-ingestion
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/device-ingestion

markdown_extensions:
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
